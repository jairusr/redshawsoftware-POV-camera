plugins {
    id "com.android.application"
}

android {
    namespace "io.github.jairusr.redshawsoftwarepovcamera"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "io.github.jairusr.redshawsoftwarepovcamera"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            // VITURE currently distributes the Neckband SDK for arm64 Android.
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
